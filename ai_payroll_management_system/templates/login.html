{% extends "base.html" %}
{% block title %}Admin Sign In{% endblock %}
{% block content %}

<div class="row justify-content-center py-4">
  <div class="col-md-7 col-lg-5 col-xl-4">
    <div class="panel p-4 p-lg-5 shadow-lg">
      <div class="text-center mb-4">
        <div class="stat-icon indigo mx-auto mb-2" style="width: 56px; height: 56px; font-size: 1.6rem;">
          ⚡
        </div>
        <h1 class="h3 fw-bold mb-1">PayPilot AI</h1>
        <p class="text-muted small">Enterprise Payroll & Workforce Platform</p>
      </div>

      <!-- Quick 1-Click Demo Login Box -->
      <div class="p-3 bg-light rounded-3 border mb-4 text-center">
        <small class="text-muted text-uppercase fw-bold d-block mb-1">Demo Credentials</small>
        <div class="small font-monospace mb-2">
          <strong>User:</strong> admin &nbsp;|&nbsp; <strong>Pass:</strong> admin123
        </div>
        <button type="button" class="btn btn-sm btn-outline-primary w-100 fw-bold" onclick="quickDemoLogin()">
          <i class="bi bi-lightning-charge-fill"></i> Fill Demo Credentials (1-Click)
        </button>
      </div>

      <form method="post" id="loginForm">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
            <input class="form-control" id="usernameInput" name="username" autocomplete="username" placeholder="admin" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
            <input class="form-control" id="passwordInput" type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
          </div>
        </div>

        <button class="btn btn-primary btn-lg w-100 fw-bold" type="submit">
          Sign In to Workspace <i class="bi bi-arrow-right ms-1"></i>
        </button>
      </form>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
function quickDemoLogin() {
  document.getElementById("usernameInput").value = "admin";
  document.getElementById("passwordInput").value = "admin123";
}
</script>
{% endblock %}
